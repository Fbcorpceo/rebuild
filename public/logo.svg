<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-label="FB Corp">
  <title>FB Corp</title>
  <style>
    .wm { font: 900 180px/1 Impact, "Arial Black", "Helvetica Neue", sans-serif; letter-spacing: -6px; }
  </style>
  <g fill="#1e4dab">
    <!-- Mast -->
    <rect x="22" y="0" width="20" height="82" />
    <!-- Boom top chord -->
    <rect x="0" y="0" width="520" height="14" />
    <!-- Boom bottom chord -->
    <rect x="40" y="48" width="480" height="8" />
  </g>
  <!-- Truss X-diagonals between top and bottom chords -->
  <g fill="none" stroke="#1e4dab" stroke-width="4">
    <path d="M42 14 L78 48 M78 14 L42 48" />
    <path d="M78 14 L114 48 M114 14 L78 48" />
    <path d="M114 14 L150 48 M150 14 L114 48" />
    <path d="M150 14 L186 48 M186 14 L150 48" />
    <path d="M186 14 L222 48 M222 14 L186 48" />
    <path d="M222 14 L258 48 M258 14 L222 48" />
    <path d="M258 14 L294 48 M294 14 L258 48" />
    <path d="M294 14 L330 48 M330 14 L294 48" />
    <path d="M330 14 L366 48 M366 14 L330 48" />
    <path d="M366 14 L402 48 M402 14 L366 48" />
    <path d="M402 14 L438 48 M438 14 L402 48" />
    <path d="M438 14 L474 48 M474 14 L438 48" />
    <path d="M474 14 L510 48 M510 14 L474 48" />
  </g>
  <!-- Hook cable -->
  <rect x="446" y="56" width="4" height="44" fill="#1e4dab" />
  <!-- Hook body -->
  <path d="M430 100 L466 100 L462 116 Q462 132 448 132 Q432 132 430 116 Z" fill="#1e4dab" />
  <circle cx="448" cy="120" r="4" fill="#ffffff" />

  <!-- FB CORP wordmark -->
  <text class="wm" x="0" y="208" fill="#1e4dab">FB CORP</text>
</svg>
